# Tự động đưa trang lên GitHub Pages mỗi khi có thay đổi trên nhánh main.
# Nếu kiểm tra hoặc đóng gói lỗi → dừng lại, trang đang chạy giữ nguyên bản cũ.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high --omit=dev
      - name: Build (content check runs first)
        run: npm run build
        env:
          BASE_PATH: /learning-architect-portfolio
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
