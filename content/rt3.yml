      label: { en: "Cohort satisfaction", vi: "Mức hài lòng của học viên" }
  secondary:
    - value: "100%"
      label: { en: "Completion rate", vi: "Tỷ lệ hoàn thành" }
    - value: "90%"
      label: { en: "On-time milestone delivery", vi: "Hoàn thành mốc tiến độ đúng hạn" }
    - value: "10+"
      label: { en: "Expert speakers per cohort", vi: "Chuyên gia khách mời mỗi khoá" }

