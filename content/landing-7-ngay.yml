# ── 5. Cách làm ──
how:
  title: "Cách làm"
  steps:
    - title: "Viết Bản yêu cầu đào tạo đầu tiên"
      text: "Mang dự án thật vào, dự buổi nhóm thứ nhất và xác định những điểm phải rõ."
    - title: "Chốt vai trò và điểm còn thiếu"
      text: "Xác định ai duyệt, Chuyên gia chốt gì, Người thiết kế đào tạo làm gì và còn câu hỏi nào chưa có câu trả lời."
      result: "Nhận góp ý lần 1, soạn câu hỏi gửi người phụ trách nội dung."
    - title: "Sửa Bản yêu cầu đào tạo và chuẩn bị nội dung xác nhận"
      text: "Dự buổi nhóm thứ hai, sửa bản yêu cầu, nhận góp ý lần 2 và chuẩn bị bản gửi cho người liên quan."
  time: "Hoàn thành trong 7 ngày, tổng thời gian làm khoảng 3–4 giờ, tính cả hai buổi nhóm."
  dates: "Thời gian triển khai: 20–27/10/2026."
  includes_label: "Để tạo ra những đầu ra trên, chương trình gồm:"
  sessions: "2 buổi nhóm trực tuyến 60 phút và 2 vòng góp ý viết"
  templates_label: "03 mẫu thực hành, gồm:"
  templates:
    - "Mẫu Bản yêu cầu đào tạo một trang sáu mục kèm một case giả định đã điền"
    - "Bảng phân vai theo từng đầu ra"
    - "Phiếu tự kiểm tra năm câu cùng mẫu email hỏi Chuyên gia, Người yêu cầu, Người duyệt"

