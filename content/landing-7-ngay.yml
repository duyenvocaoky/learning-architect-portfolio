# ── 7. Hai vòng góp ý + người hướng dẫn ──
feedback:
  title: "Hai vòng góp ý của Duyên"
  intro: "Bạn không phải tự đoán Bản yêu cầu đào tạo của mình đã đủ rõ hay chưa. Bạn viết trên chính dự án thật, nhận góp ý lần 1, sửa lại, rồi nhận góp ý lần 2 trước khi gửi cho Chuyên gia, Người yêu cầu hoặc Người duyệt."
  questions_label: "Những câu bạn có thể hỏi trong hai vòng này:"
  questions:
    - "Em điền thế này đã đủ chưa?"
    - "Phần này Người thiết kế đào tạo có quyền quyết không?"
    - "Chỗ này cần Chuyên gia chốt hay em tự làm?"
    - "Bản yêu cầu đào tạo như vậy đã đủ để bắt đầu chưa?"
  rules:
    - "Mỗi người được góp ý viết hai vòng trên một Bản yêu cầu đào tạo tối đa hai trang."
    - "Câu hỏi được gom trong nhóm và trả lời ở hai khung giờ ban ngày đã công bố."
    - "Câu hỏi gửi đúng hạn được trả lời nốt trong một ngày làm việc sau Ngày 7."
    - "Chương trình không có phiên 1:1."
  about_title: "Về Duyên"
  about:
    - "Duyên làm đào tạo và phát triển nhân tài trong doanh nghiệp với hơn 6 năm kinh nghiệm, đi qua đa dạng ngành Bán lẻ, Tài chính tiêu dùng và Edtech Singapore, từng hướng dẫn newcomer, intern và nhân sự không chuyên đào tạo thực hiện trọn vẹn dự án."
    - "Câu hỏi Duyên nhận được nhiều nhất từ đồng nghiệp là: khi đi từ nội dung tới storyboard và thiết kế, phần nào thuộc Người thiết kế đào tạo, phần nào thuộc Chuyên gia. Chương trình 7 ngày tập trung vào đúng bước đó, làm trên dự án thật của bạn."

# ── 8. Ai phù hợp ──
fit:
  title: "Ai phù hợp"
  intro: "Nhân sự L&D, ID, người làm đào tạo có dưới ba năm kinh nghiệm, đang được giao thiết kế một nội dung đào tạo nội bộ (ví dụ chuyển bộ slide thành khóa e-learning, workshop hoặc lớp offline) và phải làm việc với Chuyên gia trong 30 ngày tới."
  yes_label: "Phù hợp nếu:"
  yes:
    - "Bạn đang có một dự án đào tạo thật sắp triển khai."
    - "Bạn đã từng làm các dự án tương tự nhưng yêu cầu đào tạo hiện vẫn còn nhiều điểm chưa rõ."
    - "Bạn có thể tự viết Bản yêu cầu đào tạo và có quyền trao đổi với Chuyên gia hoặc người phụ trách nội dung."
  no_label: "Chưa phù hợp nếu:"
  no:
    - "Bạn chưa có dự án thật."
    - "Bạn đang cần người làm thay Bản yêu cầu đào tạo hoặc thiết kế chương trình đào tạo."
  privacy: "Khi gửi tài liệu để góp ý, vui lòng ẩn tên, số liệu và thông tin nội bộ."

