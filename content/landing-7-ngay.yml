# ── 2. Tình huống quen thuộc ──
situation:
  title: "Tình huống quen thuộc"
  intro: "Bạn nhận một file PowerPoint, vài tài liệu nguồn và một câu:"
  request: "Em chuyển cái này thành khóa học nhé."
  unclear_label: "Nhưng còn nhiều điều chưa rõ:"
  unclear:
    - "Người học cụ thể là ai? Kết quả cuối cùng cần đạt là gì?"
    - "Nội dung nào Chuyên gia sẽ chịu trách nhiệm?"
    - "Người thiết kế đào tạo được phép rút gọn hoặc sắp xếp lại tới đâu?"
    - "Những ai là người liên quan đến dự án? Ai là người duyệt cuối?"
    - "Khi nào được coi là ĐÃ ĐỦ THÔNG TIN để bắt đầu làm?"
  then: "Và thế là bạn bắt tay làm trước. Đến lúc duyệt mới nghe:"
  feedback:
    - "Em thêm mục A, B, C vào nhé, anh sợ người học không hiểu kỹ phần này."
    - "Phần này không được bỏ."
    - "Bản nội dung đợt trước duyệt ok rồi, nhưng video chị muốn chỉnh vài ý."
    - "Người duyệt cuối lại là một bên khác."

# ── 3. Cái giá ──
cost:
  title: "Cái giá của một Bản yêu cầu đào tạo mơ hồ"
  intro: "Một quyết định chưa chốt ở đầu dự án thường không biến mất. Nó xuất hiện trở lại ở một vòng sửa tốn công hơn. Đôi khi bạn còn phải gánh cả những quyết định mà bản thân không có khả năng tác động."
  # Mỗi thẻ: title (chưa chốt gì) → result (hậu quả)
  risks:
    - title: "Chưa chốt mục tiêu, sườn bài"
      result: "Nội dung nào cũng thành cần thiết, cần thêm."
    - title: "Chưa chốt phạm vi chỉnh sửa ở mỗi vòng"
      result: "Feedback không có điểm dừng, đến khi chẳng thể gia hạn deadline thêm."
    - title: "Chưa chốt người duyệt"
      result: "Bản hoàn thiện bỗng có thêm người vào sửa."
  closing: "Vì vậy, trước khi bắt tay vào thiết kế, bạn cần sự rõ ràng: vấn đề thực sự đằng sau yêu cầu đào tạo, tất cả những ai liên quan, và phạm vi công việc trước khi thật sự đi sâu vào thực thi."
  why_title: "Vì sao các mẫu yêu cầu đào tạo có sẵn chưa đủ?"
  why_intro: "Một mẫu sẵn trên mạng có thể cho bạn biết các hạng mục cần điền trong Bản yêu cầu đào tạo, nhưng không giúp bạn nhìn thấy vấn đề thực sự trên chính trường hợp của mình. Bạn có thể điền đủ các ô nhưng vẫn chưa rõ:"
  why_items:
    - "Như thế nào là một bản yêu cầu đã ĐỦ và ĐÚNG?"
    - "Điều gì phải được xác nhận trước khi bạn đi sâu vào chi tiết và hoàn thiện?"
    - "Đã điền hết các mục, phạm vi, nhiệm vụ, nhưng tổ chức của bạn không vận hành như thế thì nên làm thế nào?"
  why_closing: "Giá trị của chương trình không nằm ở mẫu Bản yêu cầu đào tạo. Nó nằm ở việc Duyên giúp bạn nhìn ra những điểm nghẽn có khả năng thành một vòng sửa, và những điều bạn có thể làm tốt nhất trong chính bối cảnh dự án thật của mình."

