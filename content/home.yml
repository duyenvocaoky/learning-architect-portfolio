# ── 3. Dịch vụ ──
services:
  eyebrow: { en: "What I Do", vi: "Tôi làm gì" }
  title:
    en: "Design services that help your people perform*.*"
    vi: "Dịch vụ thiết kế giúp đội ngũ của bạn làm việc hiệu quả hơn*.*"
  intro:
    en: "Four things I am hired for, each grounded in programs I have already owned and measured."
    vi: "Bốn việc tôi thường được mời làm, mỗi việc đều dựa trên những chương trình tôi đã phụ trách và đo lường kết quả."
  link: { en: "See it in practice →", vi: "Xem thực tế →" }
  items:
    - title: { en: "Learning experience design", vi: "Thiết kế trải nghiệm học tập" }
      text:
        en: "Programs designed backward from the behavior they need to change, from needs analysis through instructional design, facilitation, and evaluation."
        vi: "Chương trình được thiết kế ngược từ hành vi cần thay đổi, từ phân tích nhu cầu đến thiết kế nội dung, dẫn giảng và đánh giá."
    - title: { en: "Talent program design", vi: "Thiết kế chương trình nhân tài" }
      text:
        en: "Succession pipelines and cohort programs that move high-potential staff into manager roles, with clear promotion targets."
        vi: "Nguồn kế nhiệm và chương trình theo khoá giúp nhân sự tiềm năng lên vị trí quản lý, với mục tiêu thăng tiến rõ ràng."
    - title: { en: "Facilitation & capability building", vi: "Dẫn giảng & xây dựng năng lực" }
      text:
        en: "Live workshops, Action Learning sessions, and Train-the-Trainer so the organization can run its own programs."
        vi: "Workshop trực tiếp, buổi Action Learning và Train-the-Trainer để tổ chức tự vận hành được chương trình của mình."
    - title: { en: "Measurement & ROI", vi: "Đo lường & ROI" }
      text:
        en: "Kirkpatrick-based evaluation and ROI models that report program value in numbers a general manager can act on."
        vi: "Đánh giá theo mô hình Kirkpatrick và mô hình ROI, báo cáo giá trị chương trình bằng con số mà ban giám đốc có thể dùng để ra quyết định."

