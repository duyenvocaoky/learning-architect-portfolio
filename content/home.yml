# ── 6. Quy trình ──
process:
  eyebrow: { en: "My Process", vi: "Quy trình của tôi" }
  title:
    en: "A thoughtful process for programs that hold up*.*"
    vi: "Một quy trình chỉn chu cho những chương trình bền vững*.*"
  intro:
    en: "ADDIE, run in the open with the business at every gate."
    vi: "ADDIE, triển khai minh bạch cùng phía kinh doanh ở từng bước."
  steps:
    - title: { en: "Analyse", vi: "Phân tích" }
      text:
        en: "Training-needs analysis with staff and managers to find the real performance gap."
        vi: "Phân tích nhu cầu đào tạo cùng nhân viên và quản lý để tìm ra khoảng trống hiệu suất thật sự."
    - title: { en: "Design", vi: "Thiết kế" }
      text:
        en: "Objectives, formats, and the measurement plan agreed before anything is built."
        vi: "Thống nhất mục tiêu, hình thức và kế hoạch đo lường trước khi bắt tay xây dựng."
    - title: { en: "Develop", vi: "Phát triển" }
      text:
        en: "Materials, activities, and e-learning built with subject-matter experts."
        vi: "Xây dựng tài liệu, hoạt động và e-learning cùng chuyên gia nội dung."
    - title: { en: "Implement", vi: "Triển khai" }
      highlight: true
      text:
        en: "Facilitation, cohort operations, and stakeholder communication through delivery."
        vi: "Dẫn giảng, vận hành khoá học và truyền thông với các bên liên quan trong suốt quá trình triển khai."
    - title: { en: "Evaluate", vi: "Đánh giá" }
      text:
        en: "Kirkpatrick levels and ROI reported back to the business, then improved."
        vi: "Báo cáo các cấp độ Kirkpatrick và ROI cho phía kinh doanh, rồi cải tiến tiếp."

